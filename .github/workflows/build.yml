name: Build NRO
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Asegurar libnx
        run: |
          if [ -d /opt/devkitpro/libnx ]; then
            echo "libnx ya esta en la imagen, no hace falta instalar nada"
          else
            if command -v dkp-pacman >/dev/null 2>&1; then PM=dkp-pacman; else PM=pacman; fi
            $PM -Sy --noconfirm switch-dev
          fi
      - name: Instalar portlibs (SDL2, mesa, nouveau, curl, mbedtls, zlib)
        run: |
          if command -v dkp-pacman >/dev/null 2>&1; then PM=dkp-pacman; else PM=pacman; fi
          $PM -Sy --noconfirm switch-sdl2 switch-mesa switch-libdrm_nouveau switch-zlib switch-curl switch-mbedtls \
            || $PM -Sy --noconfirm switch-portlibs
      - name: Compilar
        run: make -j"$(nproc)"
      - name: Subir NRO
        uses: actions/upload-artifact@v4
        with:
          name: Reaweaken
          path: Reaweaken.nro
          if-no-files-found: error
